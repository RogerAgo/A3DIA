<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Créer mon mot de passe — A3DIA</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="/assets/images/logo-a3dia.png" />
  <link rel="apple-touch-icon" href="/assets/images/logo-a3dia.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#1a2961" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body">

  <!-- HEADER minimal -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="A3DIA — Accueil">
        <img src="assets/images/logo-a3dia-white.png" alt="A3DIA" />
      </a>
      <nav class="nav" aria-label="Navigation principale">
        <ul class="nav-list">
          <li><a href="/" class="nav-link">Accueil</a></li>
          <li><a href="adhesion.html" class="nav-link">Adhésion</a></li>
          <li><a href="actualites.html" class="nav-link">Actualités</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
        <span class="bar"></span>
      </button>
    </div>
  </header>

  <section class="login-section">
    <div class="container">
      <div class="login-card">
        <div class="login-card-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="21" width="28" height="19" rx="3" stroke="currentColor" stroke-width="2.2"/>
            <path d="M16 21v-5a8 8 0 0 1 16 0v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>Bienvenue sur A3DIA</h1>
        <p class="login-subtitle" id="subtitle">Créez votre mot de passe pour accéder à votre espace adhérent.</p>

        <div id="msg-error" class="login-error" role="alert" hidden></div>

        <form id="set-form" novalidate>
          <div class="field">
            <label for="password">Nouveau mot de passe</label>
            <div class="password-field">
              <input type="password" id="password" name="password" autocomplete="new-password"
                     placeholder="Au moins 8 caractères" minlength="8" required />
              <button type="button" class="password-toggle" aria-label="Afficher le mot de passe" data-target="password">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18" hidden>
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="field" style="margin-top: 16px;">
            <label for="confirm">Confirmer le mot de passe</label>
            <input type="password" id="confirm" name="confirm" autocomplete="new-password" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn btn-primary btn-block login-btn" id="submit-btn" style="margin-top: 24px;">
            Créer mon mot de passe
          </button>
        </form>

        <p class="login-help" id="login-help" hidden>
          Vous avez déjà un mot de passe ? <a href="/login">Connectez-vous</a>.
        </p>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <span>Copyright © 2026 A3DIA</span>
        <span><a href="contact.html">Nous contacter</a></span>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    const token = new URLSearchParams(location.search).get('token');
    const form = document.getElementById('set-form');
    const errorBox = document.getElementById('msg-error');
    const submitBtn = document.getElementById('submit-btn');
    const subtitle = document.getElementById('subtitle');

    function showError(msg) { errorBox.textContent = msg; errorBox.hidden = false; }

    // Valide le lien au chargement
    (async () => {
      if (!token) { form.hidden = true; showError('Lien invalide. Vérifiez le lien reçu par email.'); return; }
      try {
        const res = await fetch(`/api/auth/set-password?token=${encodeURIComponent(token)}`);
        const d = await res.json();
        if (!d.valid) { form.hidden = true; showError(d.error || 'Ce lien a expiré ou est invalide.'); document.getElementById('login-help').hidden = false; return; }
        if (d.prenom) subtitle.textContent = `Bonjour ${d.prenom}, créez votre mot de passe pour accéder à votre espace adhérent.`;
      } catch { form.hidden = true; showError('Impossible de vérifier le lien. Réessayez plus tard.'); }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      const password = form.password.value;
      const confirm = form.confirm.value;
      if (password.length < 8) return showError('Le mot de passe doit faire au moins 8 caractères.');
      if (password !== confirm) return showError('Les deux mots de passe ne correspondent pas.');

      submitBtn.disabled = true; submitBtn.textContent = 'Création…';
      try {
        const res = await fetch('/api/auth/set-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const d = await res.json();
        if (d.success) { window.location.href = '/espace-membres'; return; }
        showError(d.error || 'Erreur. Réessayez.');
        submitBtn.disabled = false; submitBtn.textContent = 'Créer mon mot de passe';
      } catch {
        showError('Problème de connexion. Réessayez.');
        submitBtn.disabled = false; submitBtn.textContent = 'Créer mon mot de passe';
      }
    });

    document.querySelectorAll('.password-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.querySelector('.eye-icon').hidden = isPassword;
        btn.querySelector('.eye-off-icon').hidden = !isPassword;
      });
    });
  </script>
</body>
</html>
