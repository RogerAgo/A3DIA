<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — A3DIA</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="/assets/images/logo-a3dia.png" />
  <link rel="apple-touch-icon" href="/assets/images/logo-a3dia.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#1a2961" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-body">

  <!-- HEADER minimal -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="A3DIA — Accueil">
        <img src="assets/images/logo-a3dia-white.png" alt="A3DIA" />
      </a>
      <nav class="nav" aria-label="Navigation principale">
        <ul class="nav-list">
          <li><a href="/" class="nav-link">Accueil</a></li>
          <li><a href="adhesion.html" class="nav-link">Adhésion</a></li>
          <li><a href="actualites.html" class="nav-link">Actualités</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
        <span class="bar"></span>
      </button>
    </div>
  </header>

  <!-- LOGIN SECTION -->
  <section class="login-section">
    <div class="container">
      <div class="login-card">
        <div class="login-card-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="16" r="8" stroke="currentColor" stroke-width="2.2"/>
            <path d="M8 42C8 34.268 15.163 28 24 28C32.837 28 40 34.268 40 42" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>Espace adhérents</h1>
        <p class="login-subtitle">Connectez-vous avec vos identifiants A3DIA</p>

        <div id="login-error" class="login-error" role="alert" hidden></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Adresse email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="votre@email.com"
              required
            />
          </div>
          <div class="field" style="margin-top: 16px;">
            <label for="password">Mot de passe</label>
            <div class="password-field">
              <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                placeholder="••••••••"
                required
              />
              <button type="button" class="password-toggle" aria-label="Afficher le mot de passe" data-target="password">
                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="18" height="18" hidden>
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block login-btn" id="login-submit" style="margin-top: 24px;">
            Se connecter
          </button>
        </form>

        <p class="login-help">
          Vous n'avez pas encore de compte ? <a href="adhesion.html">Adhérez à l'association</a>.
        </p>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        <span>Copyright © 2026 A3DIA</span>
        <span><a href="contact.html">Nous contacter</a></span>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    // Redirect if already logged in
    (async () => {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const { user } = await res.json();
          const dest = user.role === 'admin' ? '/admin' : '/espace-membres';
          window.location.replace(dest);
        }
      } catch { /* not logged in, stay on page */ }
    })();

    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.hidden = true;

      const email = form.email.value.trim();
      const password = form.password.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Connexion…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          const params = new URLSearchParams(window.location.search);
          const redirectTo = params.get('redirect') || (data.user.role === 'admin' ? '/admin' : '/espace-membres');
          window.location.href = redirectTo;
        } else {
          errorBox.textContent = data.error || 'Erreur de connexion.';
          errorBox.hidden = false;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Se connecter';
        }
      } catch {
        errorBox.textContent = 'Problème de connexion. Réessayez.';
        errorBox.hidden = false;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Se connecter';
      }
    });

    // Toggle password visibility
    document.querySelectorAll('.password-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        btn.querySelector('.eye-icon').hidden = isPassword;
        btn.querySelector('.eye-off-icon').hidden = !isPassword;
        btn.setAttribute('aria-label', isPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
      });
    });
  </script>
</body>
</html>
